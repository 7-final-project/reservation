server:
  port: 19040

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/

spring:
  spring:
    cache:
      type: redis
    data:
      redis:
        host: ${REDIS_DEV_HOST}
        port: ${REDIS_DEV_PORT}

  datasource:
    url: ${DB_DEV_URL}
    username: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      topic:
        reservation-create-event: reservation-create-event-topic
        reservation-update-event: reservation-update-event-topic
        userinfo-send-event: userinfo-send-event-topic

  config:
    import: classpath:application-key.yml